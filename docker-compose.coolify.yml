services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: api
      RUN_MIGRATIONS: auto
      API_PORT: 4000
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Coolify}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: dashboard
      PORT: 3000
      DASHBOARD_API_PROXY_TARGET: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  worker-browser:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: worker-browser
      RUN_MIGRATIONS: "0"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Coolify}"
    depends_on:
      redis:
        condition: service_healthy
    shm_size: "2gb"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - app-data:/app/data

  worker-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: worker-analysis
      RUN_MIGRATIONS: "0"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Coolify}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data

volumes:
  redis-data:
  app-data:
