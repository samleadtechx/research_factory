services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: leadfactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadfactory}
      POSTGRES_DB: leadfactory
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadfactory -d leadfactory"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: api
      RUN_MIGRATIONS: auto
      API_PORT: 4000
      DATABASE_URL: postgresql://leadfactory:${POSTGRES_PASSWORD:-leadfactory}@postgres:5432/leadfactory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: dashboard
      PORT: 3000
      DASHBOARD_API_PROXY_TARGET: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  worker-browser:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: worker-browser
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql://leadfactory:${POSTGRES_PASSWORD:-leadfactory}@postgres:5432/leadfactory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    shm_size: "2gb"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - app-data:/app/data

  worker-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: worker-analysis
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql://leadfactory:${POSTGRES_PASSWORD:-leadfactory}@postgres:5432/leadfactory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data

volumes:
  postgres-data:
  redis-data:
  app-data:
